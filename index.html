<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I love you &lt;3</title>
<style>
  html, body { margin:0; padding:0; height:100%; width:100%; background:#000; overflow:hidden; }
  #wrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#000; overflow:hidden;
  }
  #wrap:fullscreen { background:#000; }
  #wrap:-webkit-full-screen { background:#000; }
  canvas { display:block; }
  #hint {
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    color:#8ec9f5; font:14px/1.5 Arial, Helvetica, sans-serif;
    letter-spacing:.5px; opacity:.85; pointer-events:none;
    text-shadow:0 0 10px rgba(0,191,255,.8);
    transition:opacity .6s;
    z-index:10;
  }
  #hint.hide { opacity:0; }
</style>
</head>
<body>

<div id="wrap"><canvas id="c" width="2000" height="1200"></canvas></div>
<div id="hint">❤️</div>
<audio id="bgm" src="chochutthoi.mp3" loop preload="auto"></audio>

<script>
(function () {
  'use strict';

  /* ============================================================
     ============  CẤU HÌNH MÀU SẮC — CHỈNH Ở ĐÂY  ============
     ============================================================ */

  /* ---- 1) 心形里的粒子文字：随机颜色池 ---- */
  /* 每个 [R, G, B] 是一个颜色；粒子会从这里随机挑一个 */
  const COLORS = [
    [70, 130, 180],   // xanh thép
    [30, 144, 255],   // xanh dodger
    [0, 191, 255],    // cyan đậm
    [100, 149, 237],  // xanh ngô
    [65, 105, 225]    // xanh hoàng gia
  ];

  /* ---- 2) (可选) 每种词固定一个颜色 ---- */
  /* 把 USE_WORD_COLORS = true 就启用，忽略上面 COLORS 的随机池 */
  const USE_WORD_COLORS = false;
  const WORD_COLORS = {
    "love you": [255, 105, 180],   // 粉红
    "Love You": [30, 144, 255],    // 蓝
    "LOVE YOU": [0, 191, 255]      // cyan
  };

  /* ---- 3) 中间大字的颜色 ---- */
  const CENTER_COLOR = [255, 250, 245];   // 近白；想换直接改 RGB

  /* ---- 4) 中间大字的位置偏移 / 动效 ---- */
  const CENTER_OFFSET_X = 0;     // 正数往右、负数往左（像素）
  const CENTER_OFFSET_Y = 0;     // 正数往下、负数往上（像素）
  const PULSE_AMP       = 0.025; // 脉动幅度（0 = 不脉动）
  const PULSE_SPEED     = 0.05;  // 脉动速度

  /* ============================================================
     ======================  其他配置  ==========================
     ============================================================ */

  const WIDTH  = 2000;
  const HEIGHT = 1200;
  const SCALE  = 20;
  const FPS    = 60;

  const WORDS = ["love you", "Love You", "LOVE YOU"];
  const CENTER_TEXT = "I Love You ";

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const wrap = document.getElementById('wrap');

  /* ======================= TỰ CO GIÃN ======================= */
  function fit() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const s = Math.min(vw / WIDTH, vh / HEIGHT);
    canvas.style.width  = Math.max(1, Math.round(WIDTH  * s)) + 'px';
    canvas.style.height = Math.max(1, Math.round(HEIGHT * s)) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('webkitfullscreenchange', fit);
  fit();

  /* ======================= TOÁN HỌC ======================= */
  function heartXY(t) {
    const s = Math.sin(t);
    const x = 16 * s * s * s;
    const y = 13 * Math.cos(t)
            - 5  * Math.cos(2 * t)
            - 2  * Math.cos(3 * t)
            -      Math.cos(4 * t);
    return [x, -y];
  }

  function dist2(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  }

  /* ======================= SPRITE CHỮ ======================= */
  function makeSprite(text, rgb, fontSize, fontFamily, bold) {
    const fontStr = (bold ? 'bold ' : '') + fontSize + 'px ' + fontFamily;

    const tmp = document.createElement('canvas').getContext('2d');
    tmp.font = fontStr;
    const m = tmp.measureText(text);

    const tw   = Math.ceil(m.width);
    const asc  = Math.ceil(m.actualBoundingBoxAscent  || fontSize * 0.80);
    const desc = Math.ceil(m.actualBoundingBoxDescent || fontSize * 0.25);
    const th   = asc + desc;

    const pad = Math.ceil(fontSize * 2.0);
    const w = tw + pad * 2;
    const h = th + pad * 2;

    const cvs = document.createElement('canvas');
    cvs.width = w;
    cvs.height = h;
    const g = cvs.getContext('2d');

    const cx = w / 2;
    const baseY = pad + asc;
    const col = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';

    g.font = fontStr;
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    g.fillStyle = col;
    g.shadowColor = col;

    g.globalAlpha = 0.45;
    g.shadowBlur  = fontSize * 2.0;
    g.fillText(text, cx, baseY);

    g.globalAlpha = 0.70;
    g.shadowBlur  = fontSize * 0.9;
    g.fillText(text, cx, baseY);

    g.globalAlpha = 1.0;
    g.shadowBlur  = 0;
    g.fillText(text, cx, baseY);

    return { canvas: cvs, w: w, h: h };
  }

  const spriteCache = Object.create(null);

  function getSprite(kind, word, colorIdx) {
    const key = kind + '|' + word + '|' + colorIdx;
    let s = spriteCache[key];
    if (!s) {
      const size = (kind === 'outline') ? 20 : 17;
      s = makeSprite(word, COLORS[colorIdx], size,
                     'Arial, Helvetica, sans-serif', true);
      spriteCache[key] = s;
    }
    return s;
  }

  /* ============================================================
     把 WORD_COLORS 追加到 COLORS，并记录索引
     （只有 USE_WORD_COLORS = true 时才有意义）
     ============================================================ */
  const WORD_COLOR_IDX = {};
  if (USE_WORD_COLORS) {
    for (const w in WORD_COLORS) {
      WORD_COLOR_IDX[w] = COLORS.length;
      COLORS.push(WORD_COLORS[w]);
    }
  }

  /* ======================= TẠO HẠT ======================= */
  function newParticle(x, y, order, kind) {
    const word = WORDS[(Math.random() * WORDS.length) | 0];
    return {
      x: x,
      y: y,
      order: order,
      kind: kind,
      word: word,
      colorIdx: USE_WORD_COLORS
        ? WORD_COLOR_IDX[word]
        : (Math.random() * COLORS.length) | 0,
      alpha: 0,
      flicker: Math.random() * Math.PI * 2,
      delay: 0,
      sizeMult: 0.85 + Math.random() * 0.30
    };
  }

  function buildOutline(n, minGap) {
    const list = [];
    const placed = [];
    const gap2 = minGap * minGap;

    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2;
      const h = heartXY(t);
      const sx = h[0] * SCALE + WIDTH / 2;
      const sy = h[1] * SCALE + HEIGHT / 2;

      let ok = true;
      for (let k = 0; k < placed.length; k++) {
        if (dist2(sx, sy, placed[k][0], placed[k][1]) < gap2) { ok = false; break; }
      }
      if (!ok) continue;

      placed.push([sx, sy]);
      list.push(newParticle(sx, sy, i, 'outline'));
    }
    return list;
  }

  function buildFill(n, minGap) {
    const list = [];
    const placed = [];
    const gap2 = minGap * minGap;
    let attempts = 0;
    const maxAttempts = n * 80;

    while (list.length < n && attempts < maxAttempts) {
      attempts++;

      const t = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.86;
      const h = heartXY(t);
      const sx = (h[0] * r) * SCALE + WIDTH / 2;
      const sy = (h[1] * r) * SCALE + HEIGHT / 2;

      let ok = true;
      for (let k = 0; k < placed.length; k++) {
        if (dist2(sx, sy, placed[k][0], placed[k][1]) < gap2) { ok = false; break; }
      }
      if (!ok) continue;

      placed.push([sx, sy]);
      list.push(newParticle(sx, sy, (Math.random() * 321) | 0, 'fill'));
    }
    return list;
  }

  /* ======================= DỰNG CẢNH ======================= */
  const outline = buildOutline(160, 30);
  const fill    = buildFill(130, 46);

  const outlineSpan = outline.length
    ? outline.reduce(function (m, p) { return Math.max(m, p.order); }, 0)
    : 0;

  const FRAMES_PER_STEP  = 1.6;
  const fillStartFrame   = Math.floor(outlineSpan * FRAMES_PER_STEP) + 30;
  const centerStartFrame = fillStartFrame + 200;

  for (let i = 0; i < fill.length; i++) {
    fill[i].delay = fillStartFrame + fill[i].order;
  }
  for (let i = 0; i < outline.length; i++) {
    outline[i].delay = Math.floor(outline[i].order * FRAMES_PER_STEP);
  }

  const particles = outline.concat(fill);

  /* 中间大字：使用 CENTER_COLOR */
  const centerSprite = makeSprite(CENTER_TEXT, CENTER_COLOR, 54,
                                  'Georgia, "Times New Roman", serif', true);

  /* ======================= VÒNG LẶP ======================= */
  let frame = 0;
  let acc = 0;
  let last = performance.now();

  function update() {
    frame++;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (frame > p.delay && p.alpha < 255) {
        p.alpha = Math.min(255, p.alpha + 14 + ((Math.random() * 5) | 0));
      }
    }
  }

  function render() {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.alpha <= 0) continue;

      let flick = 1;
      if (p.alpha >= 255) {
        flick = 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker);
      }
      const a = p.alpha * flick;
      if (a <= 1) continue;

      const sp = getSprite(p.kind, p.word, p.colorIdx);
      const w = sp.w * p.sizeMult;
      const h = sp.h * p.sizeMult;

      ctx.globalAlpha = Math.min(1, a / 255);
      ctx.drawImage(sp.canvas, p.x - w / 2, p.y - h / 2, w, h);
    }

    if (frame > centerStartFrame) {
      const progress = Math.min(1, (frame - centerStartFrame) / 60);
      const centerAlpha = 255 * (1 - Math.exp(-progress * 8));

      if (centerAlpha > 1) {
        const pulse = 1 + PULSE_AMP * Math.sin(frame * PULSE_SPEED);
        const w = centerSprite.w * pulse;
        const h = centerSprite.h * pulse;

        ctx.globalAlpha = Math.min(1, centerAlpha / 255);
        ctx.drawImage(
          centerSprite.canvas,
          WIDTH  / 2 + CENTER_OFFSET_X - w / 2,
          HEIGHT / 2 + CENTER_OFFSET_Y - h / 2,
          w, h
        );
      }
    }

    ctx.globalAlpha = 1;
  }

  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25;

    acc += dt * FPS;
    let steps = Math.floor(acc);
    acc -= steps;
    if (steps > 4) steps = 4;

    for (let i = 0; i < steps; i++) update();

    render();
    requestAnimationFrame(loop);
  }

  /* ======================= ÂM THANH + FULLSCREEN ======================= */
  const bgm  = document.getElementById('bgm');
  const hint = document.getElementById('hint');
  bgm.volume = 0.65;

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function enterFullscreen() {
    if (isFullscreen()) return;
    const el = wrap;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) {
      try {
        const p = fn.call(el);
        if (p && typeof p.catch === 'function') p.catch(function () {});
      } catch (e) { /* bỏ qua */ }
    }
  }

  function startAll() {
    // 1) Bật nhạc
    const pr = bgm.play();
    if (pr && typeof pr.then === 'function') {
      pr.then(function () {
        hint.classList.add('hide');
      }).catch(function () {});
    }
    // 2) Vào fullscreen ngay trong gesture của người dùng
    enterFullscreen();

    // Sau 1 nhịp, nếu vẫn chưa fullscreen (bị chặn), thử lại lần nữa
    setTimeout(function () {
      if (!isFullscreen()) enterFullscreen();
      hint.classList.add('hide');
    }, 300);
  }

  // Bấm chuột / chạm / phím bất kỳ lần đầu
  window.addEventListener('pointerdown', startAll, { passive: true });
  window.addEventListener('keydown', startAll);

  // Cho phép bấm phím F để bật/tắt fullscreen bất cứ lúc nào
  window.addEventListener('keydown', function (e) {
    if (e.key === 'f' || e.key === 'F') {
      if (isFullscreen()) {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
      } else {
        enterFullscreen();
      }
    }
  });

  /* ======================= CHẠY ======================= */
  requestAnimationFrame(function (t) { last = t; requestAnimationFrame(loop); });

})();
</script>
</body>
</html>
